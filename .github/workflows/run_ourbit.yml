name: Run Ourbit Bot - Haal Bazaar Reporter

on:
  repository_dispatch:
    types: [run-ourbit-roshd]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests jdatetime pandas

      - name: Run Ourbit bot (Haal Bazaar Reporter)
        env:
          ROSHD_BOT_TOKEN: ${{ secrets.ROSHD_BOT_TOKEN }}
        run: python ourbit.py

      - name: Commit and save data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ourbit_data.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update ourbit_data.json"
          git pull --rebase || true
          git push || true
