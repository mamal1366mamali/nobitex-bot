name: Run Ourbit Filter Bot

on:
  repository_dispatch:
    types: [run-ourbit-filter]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas jdatetime openpyxl

      - name: Run Bot
        env:
          SELL_BOT_TOKEN: ${{ secrets.SELL_BOT_TOKEN }}
          BUY_BOT_TOKEN: ${{ secrets.BUY_BOT_TOKEN }}
          EXIT_BOT_TOKEN: ${{ secrets.EXIT_BOT_TOKEN }}
          REPORT_BOT_TOKEN: ${{ secrets.REPORT_BOT_TOKEN }}
          WEEKLY_REPORT_BOT_TOKEN: ${{ secrets.WEEKLY_REPORT_BOT_TOKEN }}
        run: python bot.py

      - name: Commit and save trades data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trades.json
          git diff --staged --quiet || (git commit -m "Auto-update trades.json by Bot" && git pull --rebase && git push)

