name: Run Ourbit Haal Bazaar Bot

on:
  repository_dispatch:
    types: [run-ourbit-haal]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout_step
        uses: actions/checkout@v3

      - name: Set up Python
        id: python_step
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        id: install_step
        run: |
          pip install requests pandas jdatetime

      - name: Run bot
        id: run_bot_step
        env:
          HAAL_BOT_TOKEN: ${{ secrets.HAAL_BOT_TOKEN }}
          ROSHD_BOT_TOKEN: ${{ secrets.ROSHD_BOT_TOKEN }}
        run: python haal_bazaar.py

      - name: Commit and push changes
        id: commit_step
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add haal_data.json || true
          if [ -n "$(git status --porcelain haal_data.json)" ]; then
            git commit -m "Auto-update haal_data.json by Bot"
            git pull --rebase || true
            git push || true
          fi

      - name: Notify Telegram on Workflow Failure
        if: failure() && steps.run_bot_step.outcome != 'failure'
        env:
          HAAL_BOT_TOKEN: ${{ secrets.HAAL_BOT_TOKEN }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_step.outcome }}
          PYTHON_OUTCOME: ${{ steps.python_step.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_step.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_step.outcome }}
        run: |
          TOK="${HAAL_BOT_TOKEN:-8865582989:AAHRhGoMjnVUsBpCNj_FlZAm-Hmk7p_SR0E}"
          
          FAILED_PART="اختلال موقت در سرورهای خود گیت‌هاب"
          if [ "$CHECKOUT_OUTCOME" == "failure" ]; then
            FAILED_PART="بخش دریافت فایل‌ها از مخزن گیت‌هاب (Checkout) به دلیل اختلال سرور گیت‌هاب"
          elif [ "$PYTHON_OUTCOME" == "failure" ]; then
            FAILED_PART="بخش راه‌اندازی پایتون (Set up Python) در سرور گیت‌هاب"
          elif [ "$INSTALL_OUTCOME" == "failure" ]; then
            FAILED_PART="بخش نصب کتابخانه‌ها (Install dependencies) یا کندی سرور گیت‌هاب"
          elif [ "$COMMIT_OUTCOME" == "failure" ]; then
            FAILED_PART="بخش ذخیره و آپلود فایل haal_data.json (Commit and Push) در گیت‌هاب"
          fi

          MSG="⚠️ گزارش خطا از فایل سیستم گیت‌هاب (run_haal.yml)
          ربات: Haal Bazaar Bot
          بخش دارای خطا: `${FAILED_PART}`
          توضیح: این خطا از کدهای پایتون شما نیست و به دلیل اختلال موقت در سیستم خود گیت‌هاب رخ داده است."

          curl -s -X POST "https://api.telegram.org/bot${TOK}/sendMessage" -d chat_id="114669886" --data-urlencode "text=$MSG" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TOK}/sendMessage" -d chat_id="-1004290922830" --data-urlencode "text=$MSG" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TOK}/sendMessage" -d chat_id="-1004415777827" --data-urlencode "text=$MSG" > /dev/null || true
